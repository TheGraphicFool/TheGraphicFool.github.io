name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://thegraphicfool.github.io

      # Pages runs Jekyll on uploads unless told not to, and Jekyll drops
      # folders that start with an underscore — i.e. all of `_next/`.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is still "Deploy from a branch", GitHub
      # also runs its own Jekyll build of main on every push, which publishes
      # the README. Whichever deployment lands last is what the site shows, so
      # wait for that build to finish before deploying the real site over it.
      # (Once Source is set to "GitHub Actions" that build stops running and
      # this step passes straight through.)
      - name: Wait for GitHub's branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" \
              --jq '[.workflow_runs[] | select(.path | startswith("dynamic/pages")) | select(.status != "completed")] | length')
            if [ "$pending" = "0" ]; then exit 0; fi
            echo "Branch-based Pages build still running; waiting..."
            sleep 10
          done
          echo "Gave up waiting after 6 minutes; deploying anyway."

      - id: deployment
        uses: actions/deploy-pages@v4
